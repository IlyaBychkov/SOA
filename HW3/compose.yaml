name: soa-hw3
services:
  flight-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight-local
    volumes:
      - flight-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flight -d flights"]
      interval: 1s
      retries: 3
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking-local
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U booking -d bookings"]
      interval: 1s
      retries: 3
  redis:
    image: redis:8-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      retries: 3
  flight:
    build: .
    environment:
      SERVICE: flight
      REDIS_URL: redis://redis:6379/0
      GRPC_API_KEY: ${GRPC_API_KEY:-hw3-local-development-key}
      DATABASE_URL: postgresql://flight:flight-local@flight-db:5432/flights
    command: sh -c "python -m app.db && exec python -m app.flight"
    depends_on:
      flight-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, app.flight, --healthcheck]
      interval: 1s
      retries: 3
  booking:
    build: .
    environment:
      SERVICE: booking
      GRPC_API_KEY: ${GRPC_API_KEY:-hw3-local-development-key}
      DATABASE_URL: postgresql://booking:booking-local@booking-db:5432/bookings
      FLIGHT_ADDRESS: flight:50051
    command: sh -c "python -m app.db && exec uvicorn app.booking:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      booking-db:
        condition: service_healthy
      flight:
        condition: service_healthy
volumes:
  flight-data:
  booking-data:
